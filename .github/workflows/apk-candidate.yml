name: Signed APK candidate

# Every main update gets a signed installable candidate. Tagged releases still use release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENUI_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npx vite build
        working-directory: web
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-web-dist
          path: web/dist/index.html
          retention-days: 1
          if-no-files-found: error

  apk:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: candidate-web-dist
          path: web/dist
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Build signed production APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Missing KEYSTORE_B64 signing secret"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          HM_SKIP_WEB_BUILD=1 KEYSTORE="$RUNNER_TEMP/release.keystore" VERSION_NAME=1.0.14 VERSION_CODE=10014 android/build.sh
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify production APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/build/hermes-mobile.apk
          if unzip -p android/build/hermes-mobile.apk resources.arsc | grep -aq hm_devtools; then
            echo "Production APK unexpectedly enables devtools"; exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: hermes-mobile-1.0.14-signed
          path: android/build/hermes-mobile.apk
          retention-days: 14
          if-no-files-found: error
