name: Build Hermes Taher APK

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'android/**'
      - 'web/**'
      - 'tools/sherpa-onnx.sh'
      - '.github/workflows/build-taher.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Build web UI (no signing key present)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Sign fork APK with persistent key
        env:
          KEYSTORE_B64: ${{ secrets.TAHER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Set TAHER_KEYSTORE_B64 to a persistent dedicated Hermes Taher keystore before building."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taher.keystore"
          HM_APP_VARIANT=taher HM_SKIP_WEB_BUILD=1 KEYSTORE="$RUNNER_TEMP/taher.keystore" \
            VERSION_NAME="0.8.67-taher.1" VERSION_CODE=86701 android/build.sh
          rm -f "$RUNNER_TEMP/taher.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/hermes-mobile.apk | head -n 4
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/build/hermes-mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-taher-apk
          path: android/build/hermes-mobile.apk
          if-no-files-found: error
          retention-days: 14
