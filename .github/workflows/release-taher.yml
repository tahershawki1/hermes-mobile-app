name: Hermes Taher Production Release
# Production workflow: a direct main-branch push should publish a signed release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'phone/**'
      - '.github/workflows/release-taher.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify production signing key
        env:
          KEYSTORE_B64: ${{ secrets.TAHER_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Set TAHER_KEYSTORE_B64 before releasing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taher.keystore"
          keytool -list -keystore "$RUNNER_TEMP/taher.keystore" -storepass hermesmobile >/dev/null
      - name: Android SDK
        run: |
          [ -f "$ANDROID_HOME/platforms/android-36/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ] || \
            (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null)
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Build and sign production APK
        run: |
          KEYSTORE="$RUNNER_TEMP/taher.keystore" HM_APP_VARIANT=taher HM_SKIP_WEB_BUILD=1 \
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}" VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))" android/build.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/build/hermes-mobile.apk
          cp android/build/hermes-mobile.apk Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk
          cp android/build/hermes-mobile.apk Hermes-Taher-1.0.0.apk
          sha256sum Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk > Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk.sha256
          rm -f "$RUNNER_TEMP/taher.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}
          path: |
            Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk
            Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk.sha256
            Hermes-Taher-1.0.0.apk
          retention-days: 90
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "taher-v1.0.${GITHUB_RUN_NUMBER}" Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk Hermes-Taher-1.0.${GITHUB_RUN_NUMBER}.apk.sha256 Hermes-Taher-1.0.0.apk --target "$GITHUB_SHA" --title "Hermes Taher 1.0.${GITHUB_RUN_NUMBER}" --notes "Production signed Android release."
