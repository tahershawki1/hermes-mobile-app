name: Hermes Taher Production Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'taher-v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify production signing key
        env:
          KEYSTORE_B64: ${{ secrets.TAHER_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Set TAHER_KEYSTORE_B64 before releasing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taher.keystore"
          keytool -list -keystore "$RUNNER_TEMP/taher.keystore" -storepass hermesmobile >/dev/null
      - name: Android SDK
        run: |
          [ -f "$ANDROID_HOME/platforms/android-36/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ] || \
            (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null)
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Build and sign production APK
        run: |
          KEYSTORE="$RUNNER_TEMP/taher.keystore" HM_APP_VARIANT=taher HM_SKIP_WEB_BUILD=1 \
            VERSION_NAME=1.0.0 VERSION_CODE=100000 android/build.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/build/hermes-mobile.apk
          cp android/build/hermes-mobile.apk Hermes-Taher-1.0.0.apk
          sha256sum Hermes-Taher-1.0.0.apk > Hermes-Taher-1.0.0.apk.sha256
          rm -f "$RUNNER_TEMP/taher.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Taher-1.0.0
          path: |
            Hermes-Taher-1.0.0.apk
            Hermes-Taher-1.0.0.apk.sha256
          retention-days: 90
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/taher-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Hermes-Taher-1.0.0.apk Hermes-Taher-1.0.0.apk.sha256 --title "Hermes Taher 1.0.0" --notes "Production signed Android release."
