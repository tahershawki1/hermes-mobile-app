name: Mirror Hermes engine source
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/mirror-hermes-engine.yml']
permissions:
  contents: write
concurrency:
  group: hermes-engine-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Fetch complete upstream Hermes engine history
        run: |
          git remote add hermes-upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags hermes-upstream +refs/heads/main:refs/remotes/hermes-upstream/main
          test -f .github/workflows/mirror-hermes-engine.yml
          git cat-file -e refs/remotes/hermes-upstream/main^{commit}
      - name: Publish full engine source to independent hermes-engine branch
        run: |
          git push --force origin refs/remotes/hermes-upstream/main:refs/heads/hermes-engine
      - name: Confirm mirrored engine commit
        run: |
          expected=$(git rev-parse refs/remotes/hermes-upstream/main)
          actual=$(git ls-remote origin refs/heads/hermes-engine | cut -f1)
          test "$expected" = "$actual"
          echo "Mirrored Hermes engine commit: $actual"
